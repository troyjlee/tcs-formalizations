name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build (with mathlib cache) and run checks
        uses: leanprover/lean-action@v1
      - name: check TSP paper statements and proof dependencies
        run: lake env lean scripts/audit-tsp-statements.lean
      - name: check TSP sources for admissions
        run: node scripts/check-tsp-source.mjs
