# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Metric TSP subtour-LP integrality gap"
  description: >-
    Lean proofs that every metric TSP instance on at least three vertices
    has a Hamiltonian tour costing at most (3/2 - 2.05522e-30) times any
    feasible subtour-LP objective, with one strictly larger saving uniform
    over all instances. The submission also exposes the exact finite-layer
    saving and a KKO-framework bound using GKL capacity estimates.
  authors: ["Troy Lee"]
  responsible_maintainers: ["Troy Lee"]
  license: "Apache-2.0"

classification:
  arxiv: ["cs.DS", "math.CO"]
  msc2020: ["90C27", "05C45"]

sources:
  - title: "A (Slightly) Improved Approximation Algorithm for Metric TSP"
    authors: ["Anna R. Karlin", "Nathan Klein", "Shayan Oveis Gharan"]
    id: "https://arxiv.org/abs/2007.01409v6"
    type: "article"
    location: "Structural and probabilistic ingredients, including Lemma A.1"
    relationship: "adapts"
    note: "The randomized algorithm and its running time are outside the formalized claim."
  - title: "A (Slightly) Improved Bound on the Integrality Gap of the Subtour LP for TSP"
    authors: ["Anna R. Karlin", "Nathan Klein", "Shayan Oveis Gharan"]
    id: "https://arxiv.org/abs/2105.10043v3"
    type: "article"
    location: "Theorem 1.1 and its slack framework, including Theorem 6.1"
    relationship: "adapts"
    note: >-
      kko_gap uses the KKO22 framework with GKL capacity estimates to certify
      saving 1.08e-34. This improves KKO22's stated existence claim; it is
      neither KKO22's own numerical constant nor GKL's published 2.18e-34.
  - title: "From Trees to Polynomials and Back Again: New Capacity Bounds with Applications to TSP"
    authors: ["Leonid Gurvits", "Nathan Klein", "Jonathan Leake"]
    id: "https://arxiv.org/abs/2311.09072v2"
    type: "article"
    location: "TSP specializations of Theorems 2.1, 2.6, 4.1 and Corollary 4.2"
    relationship: "adapts"
    note: >-
      The library proves homogeneous capacity and three-count specializations
      needed downstream, not the complete arbitrary-target or nonhomogeneous
      statements. These are supporting results, not separate Comparator claims.
  - title: "A Sharper Explicit Bound on the Subtour-LP Integrality Gap for Metric TSP"
    authors: ["Zhao Song"]
    id: "https://www.preprints.org/manuscript/202609.0140/v1"
    type: "preprint"
    location: "Theorem 2; final parameters in Definitions 2–3"
    relationship: "adapts"
    note: >-
      Version 1. The preliminary parameters in Definition 1 are not the
      parameters used for the final saving. Only tour existence is asserted.

status:
  scope: >-
    Complete finite undirected metric instances with n >= 3, nonnegative
    costs satisfying the triangle inequality, and every feasible subtour-LP
    point. The five compared claims are the KKO-framework saving 1.08e-34,
    Song's rounded saving 2.05522e-30, a uniform strict improvement, the exact
    million-layer saving, and the inequality certifying that saving exceeds
    the rounded target. No probability or structural certificate is an
    additional endpoint hypothesis. Algorithmic running time and
    finite-precision sampling are outside scope. Decimal constants are
    exact rationals in the reals.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)", "Codex (OpenAI)"]
      framework: "Claude and Codex coding agents"
      tool_setup: "Human-directed Lean and Mathlib proof development, compiler feedback, and statement review."
      prompting_notes: "Formalize the cited results, verify paper correspondence, and check theorem dependencies."
  spend_usd: "not specified"
  notes: >-
    Troy Lee directed the formalization and publication scope. AI assistance
    is credited here rather than as human authorship. Specific model versions
    and resource totals are not specified in this metadata.

fidelity:
  divergences: >-
    The endpoint is an existential tour bound, without the papers'
    algorithmic guarantees. The GKL results are specialized as described
    above. The constructed tree law is a limit of positive weighted
    spanning-tree laws; uniqueness as a Shannon-entropy optimizer is not
    asserted. Song's Lemma 18 window estimate is supplied by a proved
    conditioned A.1 argument retaining mass 0.499 and a probability budget
    above p = 1.9555663e-9. Exact arithmetic proves
    0.99996 < 1 - sigma - 2*d0 < 0.99997, correcting the printed illustrative
    lower bound > 0.99997. The exact finite sum supplies the strict saving.
    See docs/tsp/PROOF_NOTES.md and docs/tsp/PAPER_CORRESPONDENCE.md.

review:
  status: "agent-reviewed"
  notes: >-
    AI-assisted paper correspondence review using Codex, with Lean statement,
    axiom, and proof-dependency checks. No independent human peer review or
    source-author endorsement is claimed. The local submission-check record
    and reproduction commands are in Palomar/README.md.

alignment:
  namespace: "PalomarTSPGap"
  module: "Palomar.TSPGap.Solution"
  statements:
    - source: "KKO22 Theorem 1.1, using GKL capacity ingredients"
      lean: "PalomarTSPGap.kko_gap"
      status: "proved with improved saving 1.08e-34 and existential scope"
    - source: "Song Theorem 2, rounded saving"
      lean: "PalomarTSPGap.song_gap"
      status: "proved with existential scope"
    - source: "Song Theorem 2, strict saving uniform over all instances"
      lean: "PalomarTSPGap.song_gap_strict"
      status: "proved with existential scope"
    - source: "Song's finite threshold-layer construction"
      lean: "PalomarTSPGap.song_gap_exact"
      status: "proved with the exact finite saving"
    - source: "Song's numerical target"
      lean: "PalomarTSPGap.exactGain_gt_target"
      status: "proved by exact arithmetic bounds"

acknowledgements: "Lean, Mathlib, the cited paper authors, Anthropic Claude, and OpenAI Codex."
