name = "TCSFormalizations"
defaultTargets = ["Sunflower", "SunflowerChecks", "TSPGap", "TSPGapChecks", "QuantumQueryUsage", "Palomar"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[require]]
name = "QuantumQueryComplexity"
git = "https://github.com/troyjlee/quantum-query-complexity"
rev = "bd6b593be115d6162cef6b6539fc6fa34c340346"

[[lean_lib]]
name = "QuantumQueryUsage"

[[lean_lib]]
name = "Palomar"
globs = ["Palomar.+"]

[[lean_lib]]
name = "Sunflower"

[[lean_lib]]
name = "SunflowerChecks"

[[lean_lib]]
name = "TSPGap"

[lean_lib.leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "TSPGapChecks"

[lean_lib.leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
